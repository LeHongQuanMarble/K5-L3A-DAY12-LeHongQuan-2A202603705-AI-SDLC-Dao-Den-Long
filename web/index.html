<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đảo Đèn Lồng</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07061a; color: #f5e6c8; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; text-shadow: 0 1px 3px #000; }
    #stats { background: rgba(7,6,26,.6); padding: 8px 12px; border-radius: 8px; line-height: 1.6; }
    #stats b { color: #ffc766; }
    #cool { position: fixed; bottom: 46px; right: 12px; background: rgba(7,6,26,.6); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
    #msg { margin-top: 8px; min-height: 1.4em; color: #ffe2a8; }
    #wind { color: #8fa3b8; min-height: 1.2em; }
    #help { position: fixed; bottom: 10px; left: 12px; font-size: 13px; opacity: .8; background: rgba(7,6,26,.6); padding: 6px 10px; border-radius: 8px; }
    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(7,6,26,.75); }
    .overlay[hidden] { display: none; }
    .overlay h1 { font-size: 36px; margin: 0 0 8px; color: #ffc766; text-align: center; }
    .overlay p { margin: 4px 16px 16px; text-align: center; max-width: 560px; }
    .overlay .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button { font: inherit; padding: 10px 18px; border: 0; border-radius: 8px; background: #ffc766; color: #2a1d05; cursor: pointer; }
    #flash { position: fixed; inset: 0; background: rgba(120, 20, 160, .45); opacity: 0; pointer-events: none; transition: opacity .4s; }
    @media (max-width: 600px) { #help { font-size: 12px; } .overlay h1 { font-size: 26px; } #stats { font-size: 13px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <div id="stats">
      Đêm <b id="night">1</b> &nbsp;·&nbsp; Đom đóm: <b id="carried">0</b>/<span id="capacity">10</span> &nbsp;·&nbsp; Đèn sáng: <b id="lit">0</b>/<span id="lantern-total">5</span><br>
      Ngọn lửa: <b id="hp">3</b> &nbsp;·&nbsp; Còn lại: <b id="time">5:00</b> &nbsp;·&nbsp; Điểm đêm: <b id="score">0</b> &nbsp;·&nbsp; Tổng: <b id="total">0</b>
    </div>
    <div id="msg"></div>
  </div>
  <div id="cool">Lướt: <b id="dash-cd">sẵn sàng</b> &nbsp;·&nbsp; Tỏa sáng: <b id="pulse-cd">sẵn sàng</b></div>
  <div id="wind"></div>
  <div id="help">WASD di chuyển · ←/→ xoay camera · Space nhảy · Shift lướt · E nạp đèn · F tỏa sáng · Esc/P tạm dừng · R chơi lại</div>
  <div id="flash"></div>
  <div id="pause" class="overlay" hidden>
    <h1>Tạm dừng</h1>
    <div class="row">
      <button id="resume">Tiếp tục (Esc)</button>
      <button id="restart-night">Chơi lại Đêm này</button>
    </div>
    <label style="margin-top:14px"><input id="colorblind" type="checkbox"> Bảng màu dễ phân biệt (Bóng Mực xanh, cảnh báo trắng)</label>
  </div>
  <div id="over" class="overlay" hidden>
    <h1 id="over-title"></h1>
    <p id="over-text"></p>
    <div class="row"><button id="replay">Chơi lại (R)</button></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
